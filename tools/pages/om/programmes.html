    <section class="page-head">
      <div class="wrap">
        <h1>Sagantaa barbaadi</h1>
        <p>Waan barachuu barbaaddan barbaadaa; dhaabbileen kamtu sadarkaa kamiinii fi eessatti akka kennu ilaalaa.</p>
      </div>
    </section>

    <section class="section" style="padding-top:28px">
      <div class="wrap">
        <p class="am-note">Maqaaleen sagantaalee Afaan Ingiliziitiin. Barbaacha Afaan Ingiliziitiin barreessaa (fkn. “Nursing”), ykn filannoo armaan gadiitiin dameen calaqaa.</p>
        <div class="finder">
          <div class="search">{{icon:search}}
            <label class="visually-hidden" for="prog-search">Sagantaalee barbaadi</label>
            <input id="prog-search" type="search" placeholder="Fkn. Software Engineering, Nursing, Agricultural Economics" autocomplete="off">
          </div>
          <div class="filters">
            <div class="select-row">
              <label class="visually-hidden" for="pf-level">Sadarkaa</label><select id="pf-level"></select>
              <label class="visually-hidden" for="pf-field">Damee</label><select id="pf-field"></select>
              <label class="visually-hidden" for="pf-region">Naannoo</label><select id="pf-region"></select>
              <label class="visually-hidden" for="pf-type">Mootummaa ykn dhuunfaa</label><select id="pf-type"></select>
            </div>
            <span class="result-count" id="prog-count" aria-live="polite"></span>
          </div>
          <p class="note" id="prog-coverage"></p>
        </div>
        <div class="prog-grid" id="prog-results"></div>
      </div>
    </section>
