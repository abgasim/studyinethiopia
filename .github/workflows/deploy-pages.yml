# Publishes the site/ folder to GitHub Pages on every push to main.
# The admin dashboard is left out: it's a local tool for editing data.js.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the public site (without admin files)
        run: |
          mkdir -p _site
          cp -r site/. _site/
          rm -f _site/admin.html _site/assets/admin.js _site/assets/admin.css _site/README.md
          echo "Published files:" && find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
