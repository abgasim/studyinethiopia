# Publishes the site/ folder to GitHub Pages on every push to main.
# The admin portal (admin.html) is published too: it needs a GitHub access key to change anything.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the public site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          rm -f _site/README.md
          # Sitemap for search engines, rebuilt from data.js so admin edits are included
          node tools/build-sitemap.mjs _site
          # Cache-busting: browsers may keep files for 10 minutes, so stamp each shared
          # file reference with a fingerprint of its contents (e.g. data.js?v=3f9a1c2b).
          # When a file changes (including data.js published from the admin portal),
          # its fingerprint changes and browsers fetch the new copy straight away.
          for f in data.js app.js style.css admin.js admin.css; do
            h=$(sha256sum "_site/assets/$f" | cut -c1-10)
            find _site -name '*.html' -exec sed -i "s#assets/$f\"#assets/$f?v=$h\"#g" {} +
            echo "assets/$f -> ?v=$h"
          done
          echo "Published files:" && find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        # If this step times out ("Timeout reached"), GitHub Pages was slow to confirm:
        # open the run on GitHub and click "Re-run failed jobs". (10 minutes is GitHub's maximum wait.)
