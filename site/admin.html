<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · Study in Ethiopia</title>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/admin.css">
  <script>try{var t=localStorage.getItem("sie-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body class="admin-body">
  <div class="stripe"></div>
  <div class="admin">
    <aside class="side">
      <a class="brand" href="index.html" target="_blank" rel="noopener"><span class="brand-mark">SiE</span>Admin</a>
      <nav id="side-nav" aria-label="Sections"></nav>
      <div class="side-foot">
        <button class="side-btn" id="open-btn" type="button">Open data.js…</button>
        <a class="side-btn" href="index.html" target="_blank" rel="noopener">Preview site ↗</a>
        <button class="side-btn" id="theme-btn" type="button">Dark mode</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="section-title">Institutions</h1>
          <p id="section-help" class="muted"></p>
        </div>
        <div class="save-area">
          <span id="status" class="status" aria-live="polite"></span>
          <button class="btn btn-primary" id="save-btn" type="button" title="Save (Ctrl+S)">Save</button>
        </div>
      </header>

      <div id="banner"></div>

      <div class="admin-toolbar">
        <div class="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="visually-hidden" for="q">Search</label>
          <input id="q" type="search" placeholder="Search" autocomplete="off">
        </div>
        <label class="visually-hidden" for="filter">Filter</label>
        <select id="filter" class="select"></select>
        <button class="btn btn-primary" id="add-btn" type="button">+ Add</button>
      </div>

      <p id="count" class="muted count"></p>
      <div id="table-wrap" class="table-wrap"></div>
    </main>
  </div>

  <dialog id="editor" class="editor" aria-labelledby="editor-title">
    <form id="editor-form" method="dialog" novalidate>
      <header><h2 id="editor-title">Edit</h2><button class="x" type="button" data-close aria-label="Close">×</button></header>
      <div class="editor-body" id="editor-fields"></div>
      <footer>
        <button class="btn btn-danger-ghost" type="button" id="delete-btn">Delete</button>
        <span class="spacer"></span>
        <button class="btn btn-ghost" type="button" data-close>Cancel</button>
        <button class="btn btn-primary" type="submit" value="save" style="order:2">Save</button>
        <button class="btn btn-ghost" type="submit" value="another" id="another-btn" style="order:1">Save &amp; add another</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" accept=".js" hidden>

  <script src="assets/data.js"></script>
  <script src="assets/admin.js"></script>
</body>
</html>
